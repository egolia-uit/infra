name: Lint

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create AGE key file
        run: echo "${{ secrets.AGEKEY_CONTENT_BASE64 }}" | base64 -d > secret/age.agekey

      - name: Setup Mise
        uses: jdx/mise-action@v4
        with:
          experimental: true
          cache: true

      - name: Run lint
        run: ./scripts/lint.sh
