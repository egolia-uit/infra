---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: cnpg-billing
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-minimal-trixe
  storage:
    size: 500Mi
  monitoring:
    enablePodMonitor: false
  postgresql:
    parameters:
      timezone: ${TIMEZONE}
      log_timezone: ${TIMEZONE}
  bootstrap:
    initdb:
      database: billing
      secret:
        name: cnpg-billing-auth
  managed:
    services:
      disabledDefaultServices:
        - ro
        - r
