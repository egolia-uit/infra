---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-billing
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  template:
    spec:
      containers:
        - name: billing
          image: ghcr.io/egolia-uit/billing:latest

          ports:
            - name: http
              containerPort: 80
            - name: grpc
              containerPort: 50051
            - name: health
              containerPort: 81

          env:
            - name: EGOLIA_BILLING_SERVER_HTTP_PORT
              value: '80'
            - name: EGOLIA_BILLING_SERVER_GRPC_PORT
              value: '50051'
            - name: EGOLIA_BILLING_SERVER_HEALTH_PORT
              value: '82'
            - name: EGOLIA_BILLING_SERVER_URL
              value: https://billing.egolia.com # replace
            - name: EGOLIA_BILLING_LOG_LEVEL
              value: debug

          envFrom:
            - secretRef:
                name: billing-billing-authentik
            - secretRef:
                name: billing-billing-database

          startupProbe:
            httpGet:
              path: /billing/health/startup
              port: 81
            periodSeconds: 5
            failureThreshold: 10

          readinessProbe:
            httpGet:
              path: /billing/health/ready
              port: 81
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /billing/health/live
              port: 81
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 500m
              memory: 500Mi

  selector: {}
