---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-blog
spec:
  template:
    metadata:
      labels:
        istio.io/dataplane-mode: ambient
    spec:
      containers:
        - name: blog

          env:
            - name: EGOLIA_BLOG_SERVER_URL
              value: https://api.${PUBLIC_DOMAIN}

  selector: {}
