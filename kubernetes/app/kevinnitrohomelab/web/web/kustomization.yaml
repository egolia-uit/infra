---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: web-web
    includeSelectors: true
resources:
  - ../../../base/web/web/
  - ./httproute.yaml
  - ./otel.configmap.yaml
patches:
  - path: ./deployment.patch.yaml
  - path: ./env.secret.patch.sops.yaml
  - target:
      kind: Deployment
      name: web-web
    patch: |- # language: yaml
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef:
            name: web-otel-env
images:
  - name: ghcr.io/egolia-uit/web
    newTag: dev-2605.09.1629
