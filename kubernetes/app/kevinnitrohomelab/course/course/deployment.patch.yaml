---
# yaml-language-server: $schema=https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master/master-standalone-strict/deployment.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-course
spec:
  template:
    spec:
      containers:
        - name: course

          env:
            - name: EGOLIA_COURSE_SERVER_URL
              value: https://api.${PUBLIC_DOMAIN}

          envFrom:
            - configMapRef:
                name: course-otel-env

  selector: {}
