---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: course-course
    includeSelectors: true
resources:
  - ../../../base/course/course/
  - ./env.secret.sops.yaml
  - ./grpcroute.yaml
  - ./httproute.yaml
  - ./otel.configmap.yaml
patches:
  - path: ./deployment.patch.yaml
  - path: ./service.patch.yaml
  - target:
      kind: Deployment
      name: course-course
    patch: |- # language: yaml
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - secretRef:
              name: course-course-env
          - configMapRef:
              name: course-otel-env
images:
  - name: ghcr.io/egolia-uit/course
    newTag: dev-2605.23.1445
